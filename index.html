<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCB Bank Company Profile and Afro-Asia Solutions Documentation</title>
<link rel="icon" href="assets/gcb-logo.png">
<meta name="description" content="View and download the GCB Bank company profile and Afro-Asia Solutions documentation.">
<style>
  :root{
    --navy:#0b2545;
    --navy-2:#123a6b;
    --gold:#f2b705;
    --gold-soft:#fde9a9;
    --ink:#12202f;
    --muted:#5a6b7d;
    --line:#e2e8f0;
    --bg:#f6f8fb;
    --card:#ffffff;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  .wrap{max-width:940px;margin:0 auto;padding:0 20px}

  /* ---------- header ---------- */
  header{
    background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff;
    padding:38px 0 46px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";position:absolute;right:-90px;top:-90px;
    width:300px;height:300px;border-radius:50%;
    background:rgba(242,183,5,.13);
  }
  .brandrow{display:flex;align-items:center;gap:18px;margin-bottom:28px;flex-wrap:wrap}
  .logo{
    background:#fff;border-radius:12px;padding:12px 18px;flex:none;
    display:flex;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.18);
  }
  .logo img{height:54px;width:auto;display:block}
  .divider{width:1px;height:38px;background:rgba(242,183,5,.5);flex:none}
  .brandrow span{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);font-weight:600}
  h1{font-size:31px;line-height:1.2;margin:0 0 10px;font-weight:700;max-width:20ch}
  .sub{margin:0;max-width:60ch;color:#c8d6e8;font-size:15.5px}
  .rule{width:56px;height:4px;background:var(--gold);border-radius:2px;margin:18px 0 0}

  /* ---------- list ---------- */
  main{padding:34px 0 70px}
  .meta{
    display:flex;justify-content:space-between;align-items:baseline;
    gap:16px;flex-wrap:wrap;margin-bottom:16px;
  }
  .meta h2{font-size:16px;margin:0;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .meta .count{font-size:13.5px;color:var(--muted)}

  .doc{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:12px;
    display:flex;gap:18px;align-items:center;
    transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .doc:hover{border-color:#c7d4e4;box-shadow:0 6px 20px rgba(11,37,69,.07);transform:translateY(-1px)}
  .icon{
    width:44px;height:52px;flex:none;border-radius:6px;
    background:#fff;border:1.5px solid var(--navy);
    position:relative;display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:7px;
  }
  .icon b{font-size:9.5px;letter-spacing:.06em;color:var(--navy);font-weight:800}
  .icon::before{
    content:"";position:absolute;top:0;right:0;
    border-width:0 12px 12px 0;border-style:solid;
    border-color:transparent var(--bg) transparent transparent;
  }
  .doc-body{flex:1;min-width:0}
  .doc-body h4{margin:0 0 3px;font-size:16.5px;font-weight:650}
  .doc-body p{margin:0;font-size:13.8px;color:var(--muted)}
  .tag{
    display:inline-block;font-size:11px;font-weight:700;letter-spacing:.07em;
    text-transform:uppercase;padding:2px 8px;border-radius:20px;
    background:#eef3fa;color:var(--navy-2);margin-bottom:6px;
  }
  .actions{display:flex;gap:8px;flex:none}
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    font-size:13.5px;font-weight:650;text-decoration:none;
    padding:9px 15px;border-radius:9px;border:1px solid var(--line);
    background:#fff;color:var(--navy);white-space:nowrap;
  }
  .btn:hover{background:#f2f6fb}
  .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn.primary:hover{background:var(--navy-2)}

  /* ---------- sections ---------- */
  .jump{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
  .jump a{
    text-decoration:none;font-size:13px;font-weight:650;
    padding:7px 13px;border-radius:20px;
    background:#fff;border:1px solid var(--line);color:var(--navy);
  }
  .jump a:hover{border-color:var(--navy);background:#f2f6fb}
  .section{margin-bottom:34px;scroll-margin-top:20px}
  .section-head{display:flex;align-items:center;gap:12px;margin:0 0 14px}
  .section-head h3{
    font-size:18px;margin:0;font-weight:700;color:var(--navy);
  }
  .section-head .num{
    font-size:12px;font-weight:700;color:var(--muted);
    background:#eef3fa;border-radius:20px;padding:3px 10px;flex:none;
  }
  .section-head .bar{height:1px;background:var(--line);flex:1}

  @media (max-width:660px){
    h1{font-size:25px}
    .logo{padding:10px 14px}
    .logo img{height:42px}
    .divider{display:none}
    .doc{flex-wrap:wrap;gap:14px}
    .icon{width:38px;height:45px}
    .actions{width:100%}
    .btn{flex:1;justify-content:center}
  }
</style>
</head>

<script>
/* =====================================================================
   EDIT ONLY THIS BLOCK.

   Three sections, each with a heading and a list of documents.

   For each document:
     title : shown in bold
     href  : the link to the file
             - if the PDF sits in the /pdfs folder of this repo:
                 "GCB%20Profile.pdf"
             - if it is a OneDrive or Drive share link, paste the full URL:
                 "https://1drv.ms/b/xxxxxxxx"
     file  : the filename people get when they click Download (optional,
             only applies to files kept in this folder)
     note  : optional one line description, leave it out if not needed

   You can add or remove documents, and add or remove whole sections.
   Everything else on the page adjusts itself.
   ===================================================================== */

const SECTIONS = [
  {
    id: "profile",
    heading: "GCB Bank Company Profile",
    docs: [
      {
        title: "GCB Bank Company Profile",
        note:  "Overview",
        href:  "GCB%20Profile.pdf",
        file:  "GCB-Bank-Profile.pdf"
      }
    ]
  },
  {
    id: "trade",
    heading: "Trade and Business Enablement Solutions",
    docs: [
      {
        title: "Chinese Business Solutions",
        href:  "Chinese%20Business%20Solution.pdf",
        file:  "Chinese-Business-Solutions.pdf"
      },
      {
        title: "Ghana China Import Solutions",
        href:  "Ghana%20China%20Import%20Solution.pdf",
        file:  "Ghana-China-Import-Solutions.pdf"
      },
      {
        title: "Ghana China Export Solutions",
        href:  "Ghana%20China%20Export%20Solution.pdf",
        file:  "Ghana-China-Export-Solutions.pdf"
      },
      {
        title: "Ghana China Health Solutions",
        href:  "Ghana%20China%20Health%20Solution.pdf",
        file:  "Ghana-China-Health-Solutions.pdf"
      }
    ]
  },
  {
    id: "payments",
    heading: "Payments",
    docs: [
      {
        title: "UPI RMB Payment Solutions",
        href:  "UPI.pdf",
        file:  "UPI-RMB-Payment-Solutions.pdf"
      },
      {
        title: "CIPS",
        href:  "CIPS.pdf",
        file:  "CIPS.pdf"
      }
    ]
  }
];

/* ---------- nothing below needs editing ---------- */
(function () {
  const esc = s => String(s == null ? "" : s).replace(/[&<>"\']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const isExternal = h => /^https?:/i.test(h);

  const card = d => {
    const dl = isExternal(d.href)
      ? '<a class="btn" href="' + esc(d.href) + '" target="_blank" rel="noopener">Download</a>'
      : '<a class="btn" href="' + esc(d.href) + '" download="' + esc(d.file || "") + '">Download</a>';
    return '' +
      '<article class="doc">' +
        '<div class="icon"><b>PDF</b></div>' +
        '<div class="doc-body">' +
          '<h4>' + esc(d.title) + '</h4>' +
          (d.note ? '<p>' + esc(d.note) + '</p>' : '') +
        '</div>' +
        '<div class="actions">' +
          '<a class="btn primary" href="' + esc(d.href) + '" target="_blank" rel="noopener">View</a>' +
          dl +
        '</div>' +
      '</article>';
  };

  document.getElementById("list").innerHTML = SECTIONS.map(sec => '' +
    '<section class="section" id="' + esc(sec.id) + '">' +
      '<div class="section-head">' +
        '<h3>' + esc(sec.heading) + '</h3>' +
        '<span class="num">' + sec.docs.length + '</span>' +
        '<span class="bar"></span>' +
      '</div>' +
      sec.docs.map(card).join("") +
    '</section>'
  ).join("");

  document.getElementById("jump").innerHTML = SECTIONS.map(sec =>
    '<a href="#' + esc(sec.id) + '">' + esc(sec.heading) + '</a>'
  ).join("");

  const total = SECTIONS.reduce((n, s) => n + s.docs.length, 0);
  document.getElementById("count").textContent =
    total + (total === 1 ? " document" : " documents") +
    " across " + SECTIONS.length + " sections";
})();
</script>
